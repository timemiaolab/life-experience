name: Deploy

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build frontend
      run: npm run build
      env:
        # Use production Supabase config
        VITE_SUPABASE_URL: https://fivighqyyxlhjhicuwvv.supabase.co
        VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpdmlnaHF5eXhsaGpoaWN1d3Z2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNzQ5MDQsImV4cCI6MjEwNzk1MDkwNH0.Yu3o2jvrBa4VTC5dpIajjNBJltUyxkyKLze9PhxB5Uw
        # Set base path for GitHub Pages
        VITE_BASE_PATH: /life-experience/
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./dist
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  apply-migrations:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Apply Supabase migrations
      if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
      run: |
        echo "Applying migrations to Supabase project fivighqyyxlhjhicuwvv..."
        
        # List migration files in order
        MIGRATIONS=$(ls -1 supabase/migrations/*.sql | sort)
        
        for migration in $MIGRATIONS; do
          echo "Applying $migration..."
          MIGRATION_SQL=$(cat "$migration")
          
          # Apply migration via Supabase Management API
          curl -X POST "https://api.supabase.com/v1/projects/fivighqyyxlhjhicuwvv/database/query" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"query\": $(jq -Rs . < "$migration")}" \
            --fail-with-body || {
              echo "❌ Migration $migration failed"
              exit 1
            }
          
          echo "✓ Applied $migration"
        done
        
        echo "✓ All migrations applied successfully"
      
    - name: Skip migrations (no token)
      if: ${{ secrets.SUPABASE_ACCESS_TOKEN == '' }}
      run: |
        echo "⚠️ SUPABASE_ACCESS_TOKEN secret not set, skipping migrations."
        echo "To enable automatic migrations, add SUPABASE_ACCESS_TOKEN to repository secrets."
        echo "Get your access token from: https://supabase.com/dashboard/account/tokens"
